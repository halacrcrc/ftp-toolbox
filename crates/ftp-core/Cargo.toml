[package]
name = "ftp-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure-tokio FTP/TFTP server & client engine, GUI-agnostic"

[dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
libunftp = "0.20"
unftp-sbe-fs = "0.2"
suppaftp = { version = "6", features = ["async-native-tls"] }
